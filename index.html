<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bảng giá lúa gạo — Phòng KSNB A An</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --green:#006C30;
    --green-dark:#004D22;
    --green-soft:#E6F1EB;
    --orange:#F58322;
    --orange-soft:#FDEAD6;
    --ink:#1C2521;
    --ink-soft:#5B655F;
    --paper:#FAFAF8;
    --card:#FFFFFF;
    --line:#E4E2DC;
    --risk-low:#1F7A4D;
    --risk-low-bg:#E7F4EC;
    --risk-mid:#B9791A;
    --risk-mid-bg:#FBF0DA;
    --risk-high:#B23A2E;
    --risk-high-bg:#FBE7E3;
    --risk-none:#8A8F89;
    --risk-none-bg:#EFEEEA;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Be Vietnam Pro', 'Segoe UI', system-ui, -apple-system, sans-serif;
    background:var(--paper);
    color:var(--ink);
    line-height:1.45;
  }
  .topbar{
    background:linear-gradient(90deg, var(--green) 0%, var(--green-dark) 62%, var(--orange) 100%);
    color:#fff;
    padding:22px 28px 20px;
    position:sticky; top:0; z-index:50;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
  }
  .topbar-row{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;}
  .topbar h1{margin:0; font-size:22px; font-weight:800; letter-spacing:.2px;}
  .topbar .sub{margin-top:4px; font-size:13px; color:rgba(255,255,255,.85);}
  .sync-box{text-align:right; font-size:12px; color:rgba(255,255,255,.9);}
  .sync-box button{
    margin-top:6px; appearance:none; border:1px solid rgba(255,255,255,.5); background:transparent;
    color:#fff; font-family:inherit; font-size:12px; font-weight:600; padding:5px 11px; border-radius:6px; cursor:pointer;
  }
  .sync-box button:hover{background:rgba(255,255,255,.15);}
  .tabs{display:flex; gap:2px; margin-top:18px; flex-wrap:wrap;}
  .tab-btn{
    appearance:none; border:none; cursor:pointer;
    background:rgba(255,255,255,.14);
    color:#fff; font-family:inherit; font-weight:600; font-size:14px;
    padding:10px 18px; border-radius:8px 8px 0 0;
    transition:background .15s ease;
  }
  .tab-btn.active{background:var(--paper); color:var(--green-dark);}
  .tab-btn:not(.active):hover{background:rgba(255,255,255,.24);}

  main{max-width:1180px; margin:0 auto; padding:22px 24px 60px;}
  .panel{display:none;}
  .panel.active{display:block;}

  .toolbar{
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:16px 18px; display:flex; flex-wrap:wrap; gap:14px 22px; align-items:flex-end;
    margin-bottom:18px;
  }
  .field{display:flex; flex-direction:column; gap:6px;}
  .field label{font-size:12px; font-weight:600; color:var(--ink-soft);}
  select, input[type=text], input[type=search], input[type=number], input[type=date], textarea{
    font-family:inherit; font-size:14px; padding:8px 10px;
    border:1px solid var(--line); border-radius:7px; background:#fff; color:var(--ink);
    min-width:160px;
  }
  textarea{min-width:280px; resize:vertical;}
  select:focus, input:focus, textarea:focus{outline:2px solid var(--green); outline-offset:1px;}

  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    border:1px solid var(--line); background:#fff; color:var(--ink-soft);
    padding:6px 13px; border-radius:999px; font-size:13px; font-weight:600; cursor:pointer;
    transition:all .12s ease;
  }
  .chip.active{background:var(--green); border-color:var(--green); color:#fff;}
  .chip:hover:not(.active){border-color:var(--green);}

  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px;}
  .stats.cols-3{grid-template-columns:repeat(3,1fr);}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px;}
  .stat .num{font-size:26px; font-weight:800; color:var(--green-dark);}
  .stat .lbl{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
  .stat.high .num{color:var(--risk-high);}
  .stat.mid .num{color:var(--risk-mid);}
  .stat.list-stat{padding:12px 14px;}
  .stat.list-stat .lbl{font-size:12.5px; color:var(--ink-soft); margin-bottom:8px; font-weight:700;}
  .mini-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:5px;}
  .mini-list li{display:flex; justify-content:space-between; gap:8px; font-size:12.5px;}
  .mini-list li .nm{color:var(--ink); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .mini-list li .v{font-weight:700; flex:none;}
  .empty-mini{color:var(--ink-soft); font-size:12.5px;}

  .cat-section{margin-bottom:22px;}
  .cat-title{
    font-size:14px; font-weight:700; color:var(--green-dark);
    padding:8px 0; border-bottom:2px solid var(--green-soft); margin-bottom:8px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .cat-title .cnt{font-size:12px; font-weight:600; color:var(--ink-soft);}

  table{width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  .table-wrap{overflow-x:auto; border-radius:10px; border:1px solid var(--line); background:var(--card);}
  .table-wrap table{border:none; border-radius:0;}
  th, td{padding:9px 12px; font-size:13.5px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap;}
  th{background:var(--green-soft); color:var(--green-dark); font-weight:700; font-size:12.5px;}
  tbody tr:hover{background:#F7F8F5;}
  td.num{text-align:right; font-variant-numeric:tabular-nums;}
  td.item-name{white-space:normal; min-width:200px; font-weight:600;}

  .note-icon{
    display:inline-flex; align-items:center; justify-content:center;
    width:20px; height:20px; border-radius:50%; background:var(--green-soft); color:var(--green-dark);
    font-size:12px; font-weight:700; cursor:help; margin-left:6px;
  }
  td.risk-cell{white-space:nowrap;}

  .empty{padding:30px; text-align:center; color:var(--ink-soft); font-size:14px;}

  .chart-card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px 6px; margin-bottom:18px;}
  .chart-card h3{margin:0 0 4px; font-size:15px; color:var(--green-dark);}
  .chart-card .meta{font-size:12.5px; color:var(--ink-soft); margin-bottom:10px;}
  canvas{max-height:340px;}
  #todayBarChartWrap{position:relative; width:100%; max-height:620px; overflow-y:auto; overflow-x:hidden;}
  #todayBarChartWrap canvas{max-height:none;}

  .delta-up{color:var(--risk-high); font-weight:700;}
  .delta-down{color:var(--risk-low); font-weight:700;}
  .delta-flat{color:var(--ink-soft); font-weight:600;}

  .form-card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px 22px; margin-bottom:20px;}
  .form-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px 18px;}
  .form-grid .field{width:100%;}
  .form-grid select, .form-grid input{width:100%; min-width:0;}
  .form-actions{margin-top:16px; display:flex; align-items:center; gap:12px;}
  .btn-primary{
    appearance:none; border:none; cursor:pointer; background:var(--green); color:#fff;
    font-family:inherit; font-weight:700; font-size:14px; padding:10px 22px; border-radius:8px;
  }
  .btn-primary:hover{background:var(--green-dark);}
  .btn-ghost{
    appearance:none; border:1px solid var(--line); cursor:pointer; background:#fff; color:var(--ink-soft);
    font-family:inherit; font-weight:600; font-size:12.5px; padding:5px 12px; border-radius:6px;
  }
  .btn-edit{
    appearance:none; cursor:pointer; background:var(--green); color:#fff; border:1px solid var(--green);
    font-family:inherit; font-weight:700; font-size:12.5px; padding:6px 14px; border-radius:6px;
  }
  .btn-edit:hover{background:var(--green-dark); border-color:var(--green-dark);}
  .btn-ghost:hover{border-color:var(--risk-high); color:var(--risk-high);}
  .form-msg{font-size:13px; font-weight:600;}
  .form-msg.ok{color:var(--risk-low);}
  .form-msg.err{color:var(--risk-high);}

  .update-date{font-size:13px; font-weight:600; color:rgba(255,255,255,.95); white-space:nowrap; padding-top:6px;}
  @media (max-width:720px){
    .stats, .stats.cols-3{grid-template-columns:repeat(2,1fr);}
    .toolbar{flex-direction:column; align-items:stretch;}
    select, input[type=text]{min-width:0; width:100%;}
    .form-grid{grid-template-columns:1fr;}
  }
</style>
</head>

function uid(){ return 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }

let allDates=[], allCategories=[], byDate={}, itemsList=[], itemMeta={};
let clearedToday = false, clearedTrend = false;

function rebuildIndexes(){
  ALL = SEED_DATA.slice();

  allDates = [...new Set(ALL.map(r=>r.date))].sort();
  allCategories = [...new Set(ALL.map(r=>r.category))].sort();
  byDate = {}; allDates.forEach(d=>byDate[d]=[]);
  ALL.forEach(r=>byDate[r.date].push(r));
  itemsList = [...new Set(ALL.map(r=>r.item))].sort((a,b)=>a.localeCompare(b,'vi'));
  itemMeta = {};
  ALL.forEach(r=>{
    if(!itemMeta[r.item]) itemMeta[r.item] = {category:r.category, regions:new Set()};
    itemMeta[r.item].regions.add(r.region);
  });
  document.getElementById('lastDateTop').textContent = fmtVN(allDates[allDates.length-1]);
}

// ---------- tabs ----------
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
  });
});

// ================= TAB 1: GIÁ TRONG NGÀY =================
const dateSelect = document.getElementById('dateSelect');
const monthSelectToday = document.getElementById('monthSelectToday');
const categorySelectToday = document.getElementById('categorySelectToday');
const itemSelectToday = document.getElementById('itemSelectToday');

function monthKey(iso){ return iso.slice(0,7); } // yyyy-mm
function monthDisplay(key){ const [y,m] = key.split('-'); return `${m}/${y}`; }

function populateMonthSelectToday(){
  const prev = monthSelectToday.value;
  monthSelectToday.innerHTML = '';
  const allOpt = document.createElement('option'); allOpt.value='ALL'; allOpt.textContent='Tất cả tháng';
  monthSelectToday.appendChild(allOpt);
  const months = [...new Set(allDates.map(monthKey))].sort();
  months.forEach(mk=>{
    const o = document.createElement('option'); o.value=mk; o.textContent=monthDisplay(mk);
    monthSelectToday.appendChild(o);
  });
  monthSelectToday.value = (prev && (prev==='ALL' || months.includes(prev))) ? prev : 'ALL';
}

function populateDateSelect(){
  const prev = dateSelect.value;
  const mk = monthSelectToday.value;
  dateSelect.innerHTML = '';
  const filteredDates = (!mk || mk==='ALL') ? allDates : allDates.filter(d=>monthKey(d)===mk);
  filteredDates.slice().reverse().forEach(d=>{
    const opt = document.createElement('option');
    opt.value = d; opt.textContent = fmtVN(d);
    dateSelect.appendChild(opt);
  });
  dateSelect.value = filteredDates.includes(prev) ? prev : filteredDates[filteredDates.length-1];
}
monthSelectToday.addEventListener('change', ()=>{ clearedToday=false; populateDateSelect(); renderToday(); });

function populateCategorySelectToday(){
  const prev = categorySelectToday.value;
  categorySelectToday.innerHTML = '';
  const allOpt = document.createElement('option'); allOpt.value='ALL'; allOpt.textContent='Tất cả phân loại';
  categorySelectToday.appendChild(allOpt);
  allCategories.forEach(cat=>{
    const o = document.createElement('option'); o.value=cat; o.textContent=cat;
    categorySelectToday.appendChild(o);
  });
  categorySelectToday.value = (prev && (prev==='ALL' || allCategories.includes(prev))) ? prev : 'ALL';
}

function populateItemSelectToday(){
  const prev = itemSelectToday.value;
  const cat = categorySelectToday.value;
  const q = normalize(document.getElementById('searchToday').value.trim());
  itemSelectToday.innerHTML = '';
  const allOpt = document.createElement('option'); allOpt.value='ALL'; allOpt.textContent='Tất cả loại hàng';
  itemSelectToday.appendChild(allOpt);
  let filtered = (cat==='ALL') ? itemsList : itemsList.filter(it=>itemMeta[it].category===cat);
  if(q) filtered = filtered.filter(it=>normalize(it).includes(q));
  filtered.forEach(it=>{
    const o = document.createElement('option'); o.value=it; o.textContent=it;

categorySelectToday.addEventListener('change', ()=>{ clearedToday=false; populateItemSelectToday(); populateRegionSelectToday(); renderToday(); });
itemSelectToday.addEventListener('change', ()=>{ clearedToday=false; populateRegionSelectToday(); renderToday(); });

const regionSelectToday = document.getElementById('regionSelectToday');
function populateRegionSelectToday(){
  const prev = regionSelectToday.value;
  const cat = categorySelectToday.value;
  const selItem = itemSelectToday.value;
  regionSelectToday.innerHTML = '';
  const allOpt = document.createElement('option'); allOpt.value='ALL'; allOpt.textContent='Tất cả khu vực';
  regionSelectToday.appendChild(allOpt);

  if(cat!=='ALL') pool = pool.filter(r=>r.category===cat);

regionSelectToday.addEventListener('change', ()=>{ clearedToday=false; renderToday(); });

function monthLabel(iso){ const [y,m] = iso.split('-'); return `${m}/${y}`; }

let todayChartRef = null;

function renderToday(){
  if(clearedToday){
    document.getElementById('statsRow').innerHTML = '';
    document.getElementById('todayChartMeta').textContent = 'Chưa chọn bộ lọc — vui lòng chọn bộ lọc để xem dữ liệu.';
    if(todayChartRef){ todayChartRef.destroy(); todayChartRef = null; }
    document.getElementById('todayBarChart').style.display = 'none';
    document.getElementById('todayContent').innerHTML = '<div class="empty">Vui lòng chọn bộ lọc để xem dữ liệu.</div>';
    return;
  }
  const date = dateSelect.value;
  const cat = categorySelectToday.value;
  const selItem = itemSelectToday.value;
  const selRegion = regionSelectToday.value;
  const q = normalize(document.getElementById('searchToday').value.trim());
  let rows = byDate[date] || [];
  if(cat!=='ALL') rows = rows.filter(r=>r.category===cat);
  if(selItem!=='ALL') rows = rows.filter(r=>r.item===selItem);
  if(selRegion!=='ALL') rows = rows.filter(r=>r.region===selRegion);
  if(q) rows = rows.filter(r=>normalize(r.item).includes(q) || normalize(r.region).includes(q));

  const total = rows.length;

  // ---- Top 5 tăng mạnh / giảm mạnh (so với lần cập nhật gần nhất trước đó của từng mặt hàng-khu vực) ----
  function historyFor(item, region){
    return ALL.filter(x=>x.item===item && x.region===region)
      .sort((a,b)=> a.date===b.date ? (a.time||'').localeCompare(b.time||'') : (a.date<b.date?-1:1));
  }
  const withChange = rows.map(r=>{
    const hist = historyFor(r.item, r.region);
    const idx = hist.indexOf(r);
    const prev = idx>0 ? hist[idx-1] : null;
    let diffPct = null;
    if(prev){
      const curMid=(r.min+r.max)/2, prevMid=(prev.min+prev.max)/2;
      diffPct = prevMid ? (curMid-prevMid)/prevMid*100 : null;
    }
    return {r, diffPct};
  });
  const top5Up = withChange.filter(x=>x.diffPct!=null && x.diffPct>0).sort((a,b)=>b.diffPct-a.diffPct).slice(0,5);
  const top5Down = withChange.filter(x=>x.diffPct!=null && x.diffPct<0).sort((a,b)=>a.diffPct-b.diffPct).slice(0,5);
  const top5Spread = rows.slice().sort((a,b)=>b.spread-a.spread).slice(0,5);

  function miniListHtml(list, kind){
    if(!list.length) return '<div class="empty-mini">Không có dữ liệu.</div>';
    return '<ol class="mini-list">' + list.map(x=>{
      if(kind==='spread'){
        return `<li><span class="nm">${x.item} — ${x.region}</span><span class="v">${fmtNum(x.spread)}</span></li>`;
      }
      const cls = x.diffPct>=0 ? 'delta-up' : 'delta-down';
      const sign = x.diffPct>=0 ? '+' : '';
      return `<li><span class="nm">${x.r.item} — ${x.r.region}</span><span class="v ${cls}">${sign}${x.diffPct.toFixed(1)}%</span></li>`;
    }).join('') + '</ol>';
  }

  document.getElementById('statsRow').innerHTML = `
    <div class="stat"><div class="num">${total}</div><div class="lbl">Dòng giá cập nhật ngày ${fmtVN(date)}</div></div>
    <div class="stat list-stat"><div class="lbl">Top 5 loại tăng mạnh</div>${miniListHtml(top5Up)}</div>
    <div class="stat list-stat"><div class="lbl">Top 5 loại giảm mạnh</div>${miniListHtml(top5Down)}</div>
    <div class="stat list-stat"><div class="lbl">Top 5 loại chênh lệch mạnh</div>${miniListHtml(top5Spread,'spread')}</div>
  `;

  // ---- bar chart: Giá Min/Max theo mặt hàng (cột ngang, có số ở đầu cột) ----
  const chartRows = rows.slice().sort((a,b)=>a.item.localeCompare(b.item,'vi')).slice(0,40);
  document.getElementById('todayChartMeta').textContent = rows.length
    ? `Hiển thị ${chartRows.length}/${rows.length} dòng giá ngày ${fmtVN(date)}${rows.length>40 ? ' (thu hẹp bộ lọc để xem đủ nếu quá nhiều mặt hàng)':''}`
    : 'Không có dữ liệu để vẽ biểu đồ.';
  try{
    if(typeof Chart !== 'undefined' && chartRows.length){
      const wrapEl = document.getElementById('todayBarChartWrap');
      const canvasEl = document.getElementById('todayBarChart');
      canvasEl.style.display = '';
      wrapEl.style.height = Math.max(300, chartRows.length*52) + 'px';
      const ctx = canvasEl.getContext('2d');
      if(todayChartRef) todayChartRef.destroy();

      const valueLabelsPlugin = {
        id: 'valueLabelsToday',
        afterDatasetsDraw(chart){
          const {ctx} = chart;
          chart.data.datasets.forEach((dataset, dsIndex)=>{
            const meta = chart.getDatasetMeta(dsIndex);
            if(meta.hidden) return;
            meta.data.forEach((bar, i)=>{
              const value = dataset.data[i];
              if(value==null) return;
              ctx.save();
              ctx.fillStyle = dataset.labelColor;
              ctx.font = 'bold 12px "Be Vietnam Pro", sans-serif';
              ctx.textBaseline = 'middle';
              ctx.textAlign = 'left';
              ctx.fillText(Number(value).toLocaleString('vi-VN'), bar.x + 5, bar.y);
              ctx.restore();
            });
          });
        }
      };

      todayChartRef = new Chart(ctx, {
        type:'bar',
        data:{
          labels: chartRows.map(r=> r.item + (chartRows.filter(x=>x.item===r.item).length>1 ? ' — '+r.region : '')),
          datasets:[
            {label:'Giá Max', data: chartRows.map(r=>r.max), backgroundColor:'#F58322', labelColor:'#9a4b0f', barPercentage:0.95, categoryPercentage:0.85},
            {label:'Giá Min', data: chartRows.map(r=>r.min), backgroundColor:'#006C30', labelColor:'#004D22', barPercentage:0.95, categoryPercentage:0.85}
          ]
        },
        options:{
          indexAxis: 'y',
          responsive:true,
          maintainAspectRatio:false,
          layout:{ padding:{ right:70 } },
          plugins:{
            legend:{position:'bottom', labels:{font:{size:12.5, weight:'600'}}},
            tooltip:{ enabled:false }
          },
          scales:{
            x:{ grid:{ display:false }, border:{display:false}, ticks:{ callback:v=>Number(v).toLocaleString('vi-VN'), font:{size:11} } },
            y:{ grid:{ display:false }, border:{display:false}, ticks:{ autoSkip:false, font:{size:11.5, weight:'600'} } }
          }
        },
        plugins:[valueLabelsPlugin]
      });
    } else {
      if(todayChartRef){ todayChartRef.destroy(); todayChartRef = null; }
      if(typeof Chart === 'undefined'){
        document.getElementById('todayBarChart').style.display = 'none';
        document.getElementById('todayChartMeta').textContent = 'Không tải được thư viện biểu đồ (cần kết nối internet). Bảng số liệu bên dưới vẫn đầy đủ.';
      }
    }
  } catch(e){ console.error('today chart error', e); }

  const container = document.getElementById('todayContent');
  if(rows.length===0){
    container.innerHTML = '<div class="empty">Không có dữ liệu giá phù hợp với bộ lọc hiện tại.</div>';
    return;
  }
  const grouped = {};
  rows.forEach(r=>{ (grouped[r.category] = grouped[r.category]||[]).push(r); });

  let html = '';
  Object.keys(grouped).sort().forEach(cat=>{
    const list = grouped[cat].sort((a,b)=>a.item.localeCompare(b.item,'vi'));
    html += `<div class="cat-section">
      <div class="cat-title"><span>${cat}</span><span class="cnt">${list.length} mặt hàng</span></div>
      <div class="table-wrap"><table>
        <thead><tr>
          <th>Tháng</th><th>Ngày</th><th>Mặt hàng</th><th>Loại hàng</th><th>Khu vực</th><th>Đơn vị</th>
          <th style="text-align:right">Giá Min</th><th style="text-align:right">Giá Max</th>
          <th style="text-align:right">Chênh lệch</th>
        </tr></thead><tbody>`;
    list.forEach(r=>{
      const noteHtml = r.note ? `<span class="note-icon" title="${escAttr(r.note)}">i</span>` : '';
      html += `<tr>
        <td>${r.month || monthLabel(r.date)}</td>
        <td>${fmtVN(r.date)}</td>
        <td class="item-name">${r.item}</td>
        <td>${r.variety || r.raw_item || '—'}</td>
        <td>${r.region}</td>
        <td>${r.unit}</td>
        <td class="num">${fmtNum(r.min)}</td>
        <td class="num">${fmtNum(r.max)}</td>
        <td class="num">${fmtNum(r.spread)}</td>
      </tr>`;
    });
    html += `</tbody></table></div></div>`;
  });
  container.innerHTML = html;
}
dateSelect.addEventListener('change', ()=>{ clearedToday=false; renderToday(); });
document.getElementById('searchToday').addEventListener('input', ()=>{ clearedToday=false; populateItemSelectToday(); populateRegionSelectToday(); renderToday(); });

document.getElementById('clearFiltersToday').addEventListener('click', ()=>{
  monthSelectToday.value = 'ALL';
  populateDateSelect();
  categorySelectToday.value = 'ALL';
  document.getElementById('searchToday').value = '';
  populateItemSelectToday();
  itemSelectToday.value = 'ALL';
  populateRegionSelectToday();
  regionSelectToday.value = 'ALL';
  clearedToday = true;
  renderToday();
});

// ================= TAB 2: BIẾN ĐỘNG GIÁ =================
const categorySelectTrend = document.getElementById('categorySelectTrend');
const itemSearchTrend = document.getElementById('itemSearchTrend');
const itemSelect = document.getElementById('itemSelect');
const regionSelect = document.getElementById('regionSelect');
const monthSelectTrend = document.getElementById('monthSelectTrend');
const fromDate = document.getElementById('fromDate');
const toDate = document.getElementById('toDate');

function populateCategorySelectTrend(){
  const prev = categorySelectTrend.value;
  categorySelectTrend.innerHTML = '';
  const allOpt = document.createElement('option'); allOpt.value='ALL'; allOpt.textContent='Tất cả phân loại';
  categorySelectTrend.appendChild(allOpt);
  allCategories.forEach(cat=>{
    const o = document.createElement('option'); o.value=cat; o.textContent=cat;
    categorySelectTrend.appendChild(o);
  });
  categorySelectTrend.value = (prev && (prev==='ALL' || allCategories.includes(prev))) ? prev : 'ALL';
}

function populateItemSelect(){
  const prev = itemSelect.value;
  const cat = categorySelectTrend.value;
  const q = normalize(itemSearchTrend.value.trim());
  itemSelect.innerHTML = '';
  let filtered = (!cat || cat==='ALL') ? itemsList : itemsList.filter(it=>itemMeta[it].category===cat);
  if(q) filtered = filtered.filter(it=>normalize(it).includes(q));
  if(filtered.length===0){
    const opt = document.createElement('option'); opt.value=''; opt.textContent='Không tìm thấy mặt hàng phù hợp';
    itemSelect.appendChild(opt);
    return;
  }
  if(cat && cat!=='ALL'){
    filtered.forEach(it=>{
      const opt = document.createElement('option'); opt.value = it; opt.textContent = it;
      itemSelect.appendChild(opt);
    });
  } else {
    const groups = {};
    filtered.forEach(it=>{
      const c = itemMeta[it].category;
      if(!groups[c]){ groups[c] = document.createElement('optgroup'); groups[c].label = c; itemSelect.appendChild(groups[c]); }
      const opt = document.createElement('option'); opt.value = it; opt.textContent = it;
      groups[c].appendChild(opt);
    });
  }
  const defaultItem = filtered.includes(prev) ? prev : (filtered.find(it=>itemMeta[it].category==='Gạo Trắng') || filtered[0]);
  itemSelect.value = defaultItem;
}

categorySelectTrend.addEventListener('change', ()=>{
  clearedTrend = false;
  populateItemSelect();
  populateRegions(itemSelect.value);
  populateMonthSelectTrend();
  populateDateRange(itemSelect.value, regionSelect.value);
  renderTrend();
});

itemSearchTrend.addEventListener('input', ()=>{
  clearedTrend = false;
  populateItemSelect();
  if(itemSelect.value){
    populateRegions(itemSelect.value);
    populateMonthSelectTrend();
    populateDateRange(itemSelect.value, regionSelect.value);
    renderTrend();
  }
});

function populateRegions(item){
  const prev = regionSelect.value;
  regionSelect.innerHTML='';
  if(!item || !itemMeta[item]) return;
  const regions = [...itemMeta[item].regions].sort((a,b)=>a.localeCompare(b,'vi'));
  const preferred = regions.includes(prev) ? prev : (regions.find(r=>/chung/i.test(r)) || regions[0]);
  regions.forEach(r=>{
    const opt = document.createElement('option'); opt.value=r; opt.textContent=r;
    if(r===preferred) opt.selected = true;
    regionSelect.appendChild(opt);
  });
}

function datesForItemRegion(item, region){
  return ALL.filter(r=>r.item===item && r.region===region).map(r=>r.date).sort();
}

function populateMonthSelectTrend(){
  const prev = monthSelectTrend.value;
  monthSelectTrend.innerHTML = '';
  const allOpt = document.createElement('option'); allOpt.value='ALL'; allOpt.textContent='Tất cả tháng';
  monthSelectTrend.appendChild(allOpt);
  const item = itemSelect.value, region = regionSelect.value;
  const dates = (item && region) ? datesForItemRegion(item, region) : [];
  const months = [...new Set(dates.map(monthKey))].sort();
  months.forEach(mk=>{
    const o = document.createElement('option'); o.value=mk; o.textContent=monthDisplay(mk);
    monthSelectTrend.appendChild(o);
  });
  monthSelectTrend.value = (prev && (prev==='ALL' || months.includes(prev))) ? prev : 'ALL';
}

monthSelectTrend.addEventListener('change', ()=>{
  clearedTrend = false;
  const item = itemSelect.value, region = regionSelect.value;
  const dates = datesForItemRegion(item, region);
  const mk = monthSelectTrend.value;
  if(mk==='ALL'){
    if(dates.length){ fromDate.value = dates[0]; toDate.value = dates[dates.length-1]; }
  } else {
    const inMonth = dates.filter(d=>monthKey(d)===mk);
    if(inMonth.length){ fromDate.value = inMonth[0]; toDate.value = inMonth[inMonth.length-1]; }
  }
  renderTrend();
});

function populateDateRange(item, region){
  const dates = datesForItemRegion(item, region);
  fromDate.innerHTML=''; toDate.innerHTML='';
  dates.forEach(d=>{
    const o1=document.createElement('option'); o1.value=d; o1.textContent=fmtVN(d); fromDate.appendChild(o1);
    const o2=document.createElement('option'); o2.value=d; o2.textContent=fmtVN(d); toDate.appendChild(o2);
  });
  if(dates.length){ fromDate.value = dates[0]; toDate.value = dates[dates.length-1]; }
}

function renderTrend(){
  if(clearedTrend){
    document.getElementById('chartTitle').textContent = '';
    document.getElementById('chartMeta').textContent = 'Chưa chọn bộ lọc — vui lòng chọn bộ lọc để xem dữ liệu.';
    document.getElementById('trendStatsRow').innerHTML = '';
    if(chartRef){ chartRef.destroy(); chartRef = null; }
    document.getElementById('trendTableWrap').innerHTML = '<div class="empty">Vui lòng chọn bộ lọc để xem dữ liệu.</div>';
    return;
  }
  const item = itemSelect.value;
  const region = regionSelect.value;
  let dates = datesForItemRegion(item, region);
  const from = fromDate.value, to = toDate.value;
  dates = dates.filter(d=> d>=from && d<=to);
  const points = dates.map(d=> ALL.find(r=>r.item===item && r.region===region && r.date===d));

  document.getElementById('chartTitle').textContent = `${item} — ${region}`;
  document.getElementById('chartMeta').textContent = points.length
    ? `${points.length} lần cập nhật, từ ${fmtVN(dates[0])} đến ${fmtVN(dates[dates.length-1])} · Đơn vị: ${points[0].unit}`
    : 'Không có dữ liệu trong khoảng ngày đã chọn.';

  if(points.length){
    const maxOfMax = Math.max(...points.map(p=>p.max));
    const minOfMin = Math.min(...points.map(p=>p.min));
    const maxSpread = Math.max(...points.map(p=>p.spread));
    document.getElementById('trendStatsRow').innerHTML = `
      <div class="stat"><div class="num">${fmtNum(maxOfMax)}</div><div class="lbl">Giá Max cao nhất</div></div>
      <div class="stat"><div class="num">${fmtNum(minOfMin)}</div><div class="lbl">Giá Min thấp nhất</div></div>
      <div class="stat"><div class="num">${fmtNum(maxSpread)}</div><div class="lbl">Mức chênh lệch cao nhất</div></div>`;
  } else {
    document.getElementById('trendStatsRow').innerHTML = '';
  }

  try{
    if(typeof Chart !== 'undefined' && points.length){
      const canvas = document.getElementById('priceChart');
      const ctx = canvas.getContext('2d');
      if(chartRef) chartRef.destroy();

      const trendValueLabelsPlugin = {
        id: 'trendValueLabelsPlugin',
        afterDatasetsDraw(chart){
          const {ctx} = chart;
          chart.data.datasets.forEach((dataset, dsIndex)=>{
            const meta = chart.getDatasetMeta(dsIndex);
            if(meta.hidden) return;
            const isMax = /max/i.test(dataset.label);
            meta.data.forEach((point, i)=>{
              const value = dataset.data[i];
              if(value==null) return;
              ctx.save();
              ctx.fillStyle = dataset.borderColor;
              ctx.font = 'bold 11px "Be Vietnam Pro", sans-serif';
              ctx.textAlign = 'center';
              ctx.textBaseline = isMax ? 'bottom' : 'top';
              ctx.fillText(Number(value).toLocaleString('vi-VN'), point.x, point.y + (isMax ? -6 : 6));
              ctx.restore();
            });
          });
        }
      };

      chartRef = new Chart(ctx, {
        type:'line',
        data:{ labels: dates.map(fmtVN), datasets:[
          {label:'Giá Min', data: points.map(p=>p.min), borderColor:'#006C30', backgroundColor:'#006C30', tension:.25, pointRadius:3},
          {label:'Giá Max', data: points.map(p=>p.max), borderColor:'#F58322', backgroundColor:'#F58322', tension:.25, pointRadius:3}
        ]},
        options:{ responsive:true, layout:{ padding:{ top:22, bottom:14 } }, plugins:{legend:{position:'bottom'}},
          scales:{ y:{ ticks:{ callback:v=>Number(v).toLocaleString('vi-VN') } } } },
        plugins:[trendValueLabelsPlugin]
      });
    }
  } catch(e){ console.error('Chart render error', e); }

  const wrap = document.getElementById('trendTableWrap');
  if(points.length===0){ wrap.innerHTML = '<div class="empty">Không có dữ liệu để hiển thị.</div>'; return; }
  // Bảng hiển thị từ ngày gần nhất đến xa nhất; biểu đồ ở trên vẫn giữ chiều thời gian tăng dần
  const tablePoints = points.slice().reverse();
  let html = `<div class="table-wrap"><table><thead><tr>
    <th>Tháng</th><th>Ngày</th><th>Loại hàng chuẩn</th><th style="text-align:right">Giá Min</th><th style="text-align:right">Giá Max</th>
    <th style="text-align:right">Chênh lệch</th><th>Thay đổi so với lần trước</th>
  </tr></thead><tbody>`;
  tablePoints.forEach((p,i)=>{
    let deltaHtml = '<span class="delta-flat">—</span>';
    if(i<tablePoints.length-1){
      const prevMid = (tablePoints[i+1].min+tablePoints[i+1].max)/2;
      const curMid = (p.min+p.max)/2;
      const diff = curMid - prevMid;
      const pct = prevMid ? (diff/prevMid*100) : 0;
      if(Math.abs(diff) < 1e-6){ deltaHtml = '<span class="delta-flat">Không đổi</span>'; }
      else if(diff>0){ deltaHtml = `<span class="delta-up">▲ +${fmtNum(diff)} (${pct.toFixed(1)}%)</span>`; }
      else { deltaHtml = `<span class="delta-down">▼ ${fmtNum(diff)} (${pct.toFixed(1)}%)</span>`; }
    }
    const noteHtml = p.note ? `<span class="note-icon" title="${escAttr(p.note)}">i</span>` : '';
    html += `<tr>
      <td>${p.month || monthLabel(p.date)}</td>
      <td>${fmtVN(p.date)} <span style="color:var(--ink-soft); font-weight:400;">${p.time||''}</span></td>
      <td>${p.item}</td>
      <td class="num">${fmtNum(p.min)}</td>
      <td class="num">${fmtNum(p.max)}</td>
      <td class="num">${fmtNum(p.spread)}</td>
      <td>${deltaHtml}</td>
    </tr>`;
  });
  html += '</tbody></table></div>';
  wrap.innerHTML = html;
}
